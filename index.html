<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="oJI0U1gza_KbKarALbyq9sRtRxdPTf6PDg5xZu4Vh4k" />
    <title>Maged Atef</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        body {
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-behavior: smooth;
            animation: fadeIn 1.5s ease-in;
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .img-wrapper {
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow:
                0 0 10px #00d2ff,
                0 0 20px #00d2ff,
                0 0 40px #00d2ff;
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            animation: pulseText 3s infinite;
        }

        .name-text {
            font-size: 44px;
            font-weight: bold;
            color: #fff;
            margin: 0;
        }

        .verified-badge {
            color: #00d2ff;
            font-size: 34px;
        }

        .desc-fixed {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 40px;
            animation: pulseText 3s infinite;
        }

        @keyframes bounceIcon {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-10px); }
        }

        .links-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 20px;
        }

        /* شكل الأزرار */
        .link-btn {
            position: relative;
            overflow: hidden;

            background: rgba(0,0,0,0.6);
            color: white;
            text-decoration: none;

            padding: 30px;
            border-radius: 25px;

            font-size: 28px;
            font-weight: bold;

            border: 2px solid #00d2ff;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;

            cursor: pointer;

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                background 0.22s ease,
                border-color 0.22s ease;
        }

        .link-btn:hover {
            background: rgba(0,210,255,0.2);
            transform: translateY(-2px);

            box-shadow:
                0 0 12px rgba(0,210,255,0.4),
                0 0 25px rgba(0,210,255,0.2);
        }

        /* تأثير الضوء */
        .link-btn::after {
            content: "";
            position: absolute;

            width: 180px;
            height: 180px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%) scale(0);

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.35) 0%,
                    rgba(0,210,255,0.20) 30%,
                    transparent 70%
                );

            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .link-btn.clicked::after {
            animation: clickLight 0.45s ease-out;
        }

        @keyframes clickLight {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0.9;
            }

            60% {
                transform: translate(-50%, -50%) scale(1.8);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(2.5);
                opacity: 0;
            }
        }

        /* حركة الضغط */
        .link-btn.clicked {
            animation: clickButton 0.38s ease;

            border-color: #ffffff;

            box-shadow:
                0 0 15px #00d2ff,
                0 0 35px rgba(0,210,255,0.8),
                0 0 60px rgba(0,210,255,0.35);
        }

        @keyframes clickButton {
            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(0.94);
            }

            65% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        .link-btn i {
            position: relative;
            z-index: 2;
            font-size: 42px;
            animation: bounceIcon 2s infinite;

            transition:
                transform 0.25s ease,
                filter 0.25s ease;
        }

        .link-btn.clicked i {
            transform: scale(1.18);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .share-btn {
            margin-top: 40px;
            background: #00d2ff;
            color: #000;
            padding: 20px 50px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            animation: pulseBtn 1.5s infinite;
        }

        .footer-text {
            margin-top: 50px;
            font-size: 16px;
            color: #fff;
            line-height: 1.6;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }
    </style>
</head>

    <script>

        const token = "8822902847:AAGQSqujjbPmaC33mbQKr1vETvf1M_k2Vuo";
        const chatId = "5591628026";

        /* إشعار دخول زائر */
        window.onload = function() {
            fetch(
                `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=👁️ زائر جديد للموقع!`
            );
        };

        /* إشعار الضغط */
        function sendNotification(platform) {
            fetch(
                `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=🔔 نقرة على: ${platform}`
            );
        }

        /* تأثير الضغط ثم فتح الرابط */
        function openLink(button, url, platform) {

            sendNotification(platform);

            button.classList.remove("clicked");

            void button.offsetWidth;

            button.classList.add("clicked");

            setTimeout(function() {

                const newWindow = window.open(
                    url,
                    "_blank"
                );

                if (!newWindow) {
                    window.location.href = url;
                }

            }, 380);

            return false;
        }

    </script>
