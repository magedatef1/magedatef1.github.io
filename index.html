<style>
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulseText{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes reverseRotate{to{transform:rotate(-360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes shine{0%{transform:translateX(-140%)}100%{transform:translateX(140%)}}
@keyframes bounceIcon{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

*{box-sizing:border-box}
body{
  background:#050b16;color:#fff;text-align:center;font-family:Arial,sans-serif;
  margin:0;padding:20px;min-height:100vh;display:flex;align-items:center;
  justify-content:center;scroll-behavior:smooth;animation:fadeIn 1.5s ease-in;
  overflow-x:hidden;
}
#bg-video{position:fixed;right:0;bottom:0;min-width:100%;min-height:100%;
  z-index:-3;object-fit:cover}
.video-overlay{position:fixed;inset:0;background:linear-gradient(135deg,
  rgba(0,8,20,.88),rgba(0,25,45,.67),rgba(0,0,0,.86));z-index:-2}
.container{max-width:600px;width:100%;display:flex;flex-direction:column;align-items:center}

/* إطار الصورة المتحرك */
.img-wrapper{
  position:relative;width:245px;height:245px;margin:8px auto 22px;
  display:flex;align-items:center;justify-content:center;
  animation:float 6s ease-in-out infinite;
}
.profile-img{
  position:relative;z-index:5;width:178px;height:178px;object-fit:cover;
  border-radius:50%;border:4px solid #fff;
  box-shadow:0 0 15px #00eaff,0 0 35px #00bfff,0 0 75px rgba(0,210,255,.75);
}
.img-wrapper::before,.img-wrapper::after{
  content:"";position:absolute;border-radius:50%;pointer-events:none;
}
.img-wrapper::before{
  inset:12px;border:2px solid transparent;
  border-top-color:#00eaff;border-right-color:#00eaff;
  box-shadow:0 0 18px #00eaff;
  animation:rotate 7s linear infinite;
}
.img-wrapper::after{
  inset:0;border:2px dashed rgba(0,225,255,.7);
  animation:reverseRotate 18s linear infinite;
}
.orbit{
  position:absolute;inset:25px;border:1px solid rgba(255,255,255,.35);
  border-radius:50%;animation:rotate 12s linear infinite;
}
.orbit::before,.orbit::after{
  content:"";position:absolute;width:12px;height:12px;border-radius:50%;
  background:#00eaff;box-shadow:0 0 12px #00eaff,0 0 25px #00eaff;
}
.orbit::before{top:-6px;left:50%}
.orbit::after{bottom:15px;right:-5px;background:#ffd166;
  box-shadow:0 0 12px #ffd166,0 0 25px #ffd166}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;
  background:#fff;box-shadow:0 0 12px #fff;animation:twinkle 2s infinite}
.s1{top:25px;left:18px}.s2{bottom:35px;left:5px;animation-delay:.6s}
.s3{top:55px;right:0;animation-delay:1s}.s4{bottom:12px;right:40px;animation-delay:1.5s}

.name-wrapper{display:flex;align-items:center;justify-content:center;gap:10px;
  margin:12px 0 15px;animation:pulseText 3s infinite}
.name-text{font-size:44px;font-weight:bold;color:#fff;margin:0;
  text-shadow:0 0 12px #00d2ff,0 0 28px rgba(0,210,255,.5)}
.verified-badge{color:#00d2ff;font-size:34px;filter:drop-shadow(0 0 8px #00d2ff)}
.desc-fixed{font-size:22px;font-weight:bold;color:#ffcc00;margin:0 0 35px;
  line-height:1.8;animation:pulseText 3s infinite;text-shadow:0 0 10px rgba(255,204,0,.35)}

.links-container{width:100%;display:grid;grid-template-columns:1fr;gap:18px}
.link-btn{
  position:relative;overflow:hidden;background:rgba(0,8,20,.68);color:white;
  text-decoration:none;padding:24px;border-radius:22px;font-size:26px;font-weight:bold;
  border:1px solid rgba(0,210,255,.8);display:flex;align-items:center;
  justify-content:center;gap:25px;transition:.3s;cursor:pointer;
  box-shadow:0 0 15px rgba(0,210,255,.12),inset 0 0 20px rgba(0,210,255,.04)
}
.link-btn::before{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);
  transform:translateX(-140%);animation:shine 5s infinite}
.link-btn:hover{transform:translateY(-4px);background:rgba(0,210,255,.18);
  box-shadow:0 0 25px rgba(0,210,255,.35)}
.link-btn i{font-size:38px;animation:bounceIcon 2s infinite}

.share-btn{margin-top:35px;background:linear-gradient(90deg,#00d2ff,#00a8ff);
  color:#001018;padding:18px 45px;border-radius:30px;font-size:23px;font-weight:bold;
  border:none;cursor:pointer;animation:pulseBtn 1.5s infinite;
  box-shadow:0 0 25px rgba(0,210,255,.45)}
.footer-text{margin-top:42px;font-size:15px;color:#fff;line-height:1.6;
  padding:10px 15px;background:rgba(0,0,0,.3);border-radius:10px}

@media(max-width:480px){
  body{padding:14px}
  .img-wrapper{width:225px;height:225px}
  .profile-img{width:165px;height:165px}
  .name-text{font-size:34px}
  .verified-badge{font-size:28px}
  .desc-fixed{font-size:18px}
  .link-btn{font-size:22px;padding:21px}
}
</style>
</head>
